name: Cânone main — integridade e regressão (NO-GO, sem deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canone-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-readonly:
    name: Source hashes + offline regression (no DB / no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node 22 from pinned setup-node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify single-branch versioning and NO-GO snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          version=pathlib.Path('VERSION').read_text(encoding='utf-8').strip()
          changelog=pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert version and version in changelog, 'VERSION is absent from CHANGELOG'
          assert version.startswith('0.'), 'No stable version without formal release gate'
          assert pathlib.Path('source-s22/QUARENTENA_S22_NO_GO.md').exists(), 'Missing quarantined source marker'
          assert pathlib.Path('docs/VERSIONAMENTO_MAIN.md').exists(), 'Missing main-only versioning policy'
          print('PASS main version',version,'; source quarantined; NO-GO')
          PY
      - name: Verify 389 imported Git source blobs against recorded SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'inventories/source/CANONE_S22_SOURCE_IMPORT_MANIFEST.json').read_text())
          assert m['release_gate']=='NO_GO'
          assert m['included_total']==389 and m['excluded_total']==87
          assert len(m['included_files'])==389
          for path,rec in m['included_files'].items():
              b=(root/'source-s22'/path).read_bytes()
              assert len(b)==rec['bytes'], f'size drift: {path}'
              assert hashlib.sha256(b).hexdigest()==rec['sha256'], f'hash drift: {path}'
          print('389/389 source SHA-256 verified; excluded files remain on HOLD.')
          PY
      - name: Validate 30-migration and 90-table Supabase canonical crosswalk
        shell: bash
        run: |
          python3 tools/canone_supabase_crosswalk.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_crosswalk.py' -v
      - name: Verify generated 82-table Supabase SQL and source lineage
        shell: bash
        run: |
          python3 tools/convert_canone_schema.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_domain_conversion.py' -v
          python3 tools/convert_canone_constraints.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_indexes_constraints.py' -v
      - name: Validate 182 S22 behaviour statements and generated Supabase RLS/views
        shell: bash
        run: |
          python3 tools/convert_canone_behaviour.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_behaviour_conversion.py' -v
      - name: Verify alpha6 integrity triggers and source hashes (no DB)
        shell: bash
        run: |
          python3 tools/convert_canone_integrity.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_integrity_conversion.py' -v
      - name: Validate audit v2/sealing generator and 12 static regression tests
        shell: bash
        run: |
          python3 tools/convert_canone_audit_seal.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_audit_seal.py' -v
      - name: Validate alpha8 private exam service and exactly-once SRS candidate
        shell: bash
        run: |
          python3 tools/convert_canone_attempt_srs.py --root . --check
          python3 -m unittest discover -s tests -p 'test_canone_attempt_srs.py' -v
      - name: Alpha9 gateway/Auth/entitlement manifest integrity and offline API negatives
        shell: bash
        run: |
          python3 tools/check_canone_alpha9.py --root . --check
          node --test tests/alpha9-gateway.test.mjs
      - name: NS-01 verify 182 legacy object declarations and candidate lineage
        shell: bash
        run: |
          python3 tools/reconcile_s22_objects.py --root . --check
          python3 -m unittest discover -s tests -p 'test_ns01_object_reconciliation.py' -v
      - name: F1 NS01 every SQL declaration closure queue and original source blob integrity
        run: |
          python3 tools/ns01_closure_queue.py
          python3 -m unittest discover -s tests -p 'test_ns01_closure_queue.py' -v
      - name: F1 NS01 private SRS due HTTP gateway contract and field validation
        run: node --test tests/f1_ns01_srs_gateway.test.mjs
      - name: F1 NS01 SRS due private contract static tests
        run: python3 -m unittest discover -s tests -p 'test_f1_ns01_due_contract.py' -v
      - name: NS-02 local synthetic identity — real HTTP path, forged JWT and cross-user negatives
        shell: bash
        env:
          CANONE_SYNTHETIC_TEST_ONLY: "1"
        run: node --test tests/ns02_local_identity_http.test.mjs
      - name: NS-04 student controller — synthetic UI state and same-origin gateway contract
        shell: bash
        run: node --test tests/ns04_student_frontend.test.mjs
      - name: F4-04D remaining 64 groups original objectives and immutable pilot check
        run: |
          python3 tools/f4_remaining_objectives_gate.py
          python3 -m unittest discover -s tests -p 'test_f4_remaining_objectives_gate.py' -v
      - name: F4-04C CFC official 2026 revision impact notices and effectiveness hold
        run: |
          python3 tools/f4_norm_revision_gate.py
          python3 -m unittest discover -s tests -p 'test_f4_norm_revision_gate.py' -v
      - name: F4-04B original learning objectives pilot lineage and review holds
        run: |
          python3 tools/f4_objective_pilot_gate.py
          python3 -m unittest discover -s tests -p 'test_f4_objective_pilot_gate.py' -v
      - name: F4-04 Annex II structural atomization with duplicate labels and norm holds
        run: |
          python3 tools/f4_atomization_gate.py
          python3 -m unittest discover -s tests -p 'test_f4_atomization_gate.py' -v
      - name: F4-02 EQT six separate modalidades and discursive exam source gate
        run: |
          python3 tools/f4_eqt_modalities.py
          python3 -m unittest discover -s tests -p 'test_f4_eqt_modalities.py' -v
      - name: F4-01 primary source, exam edition and curriculum gate
        run: |
          python3 tools/f4_official_source_curriculum.py --check
          python3 -m unittest discover -s tests -p 'test_f4_official_source_curriculum.py' -v
      - name: F3-REC07 offline rights registry and adversarial state transitions
        run: |
          python3 tools/f3_rec07_editorial_rights_gate.py --check
          python3 -m unittest discover -s tests -p 'test_f3_rec07_rights_gate.py' -v
      - name: "F3-REC06 gateway: private synthetic question delivery and rights controls"
        run: node --test tests/f3_question_delivery_gateway.test.mjs
      - name: F3-REC05 owner-only reading and no-key gateway contracts
        run: node --test tests/f3_student_read_gateway.test.mjs
      - name: F3 React API contract security tests (no network database)
        run: node --experimental-strip-types --test tests/f3_react_gateway_contract.test.mjs
      - name: F3 validate historical frontend crosswalk and source integrity
        run: |
          python3 tools/verify_f3_reconciliation.py
          python3 -m unittest discover -s tests -p 'test_f3_reconciliation.py' -v
      - name: Recreate a synthetic fixture for omitted editorial sample IDs
        shell: bash
        run: |
          # The original 13 KB editorial question bank remains quarantined outside public Git.
          # This ephemeral fixture validates the frontend boundary, NOT normative content.
          mkdir -p source-s22/extras/editorial-review
          cat > source-s22/extras/editorial-review/questoes-s6-pendente.ts <<'SYNTHETIC_FIXTURE'
          /**
           * SYNTHETIC / HOLD_RIGHTS: only identifiers for a security boundary test.
           * No original statement, answer key, normative text, or editorial right is conveyed.
           */
          export const idsQuarentena = ['CFC-STRUCT-001', 'CG-003'] as const;
          SYNTHETIC_FIXTURE
      - name: Install backend dependencies and isolated S20 TypeScript 5.8.3 compatibility fixture
        working-directory: source-s22/backend
        shell: bash
        run: |
          # Declared backend TS 7.0.2 removed JS compiler APIs used in legacy S20 tests.
          # Test-only compatibility override; production dependency remains HOLD_TYPESCRIPT_API.
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5.8.3
          node -e "const ts=require('typescript'); if(ts.version!=='5.8.3') process.exit(1); console.log('Test-only TypeScript',ts.version)"
      - name: Validate dedicated-Supabase identity pilot and RLS contract
        shell: bash
        run: |
          python3 tools/verify_supabase_stage_pilot.py --root . --check
          python3 -m unittest discover -s tests -p 'test_supabase_stage_pilot.py' -v
      - name: Execute candidate in isolated in-memory PGlite (no network)
        shell: bash
        run: node tests/supabase_stage_pilot_pglite.mjs
      - name: Execute 82 converted domain DDL tables in isolated PGlite
        shell: bash
        run: node tests/canone_domain_tables_pglite.mjs
      - name: Execute invoker views and owner-only RLS negative tests in PGlite
        shell: bash
        run: node tests/canone_behavior_pglite.mjs
      - name: Execute alpha6 integrity/immutability negative tests in isolated PGlite
        shell: bash
        run: node tests/canone_integrity_pglite.mjs
      - name: Execute audit tamper detection and complete exam seal in PGlite
        shell: bash
        run: node tests/canone_audit_seal_pglite.mjs
      - name: Execute alpha8 private attempt grading and SRS negative tests in PGlite
        shell: bash
        run: node tests/canone_attempt_srs_pglite.mjs
      - name: S22 offline-only 277 regression tests (synthetic excluded-source fixture)
        run: python3 source-s22/backend/db/shared-host/s22-contracts/run_local_gates.py
      - name: Show bounded offline failure diagnostics
        if: failure()
        shell: bash
        run: |
          for f in source-s22/backend/db/shared-host/s22-contracts/*.log; do
            if [ -f "$f" ]; then
              echo "=== ${f##*/} ==="
              tail -n 65 "$f" | sed -E 's/(token|password|secret|credential|api[_-]?key)([[:space:]]*[:=][[:space:]]*)[^[:space:]]+/\\1\\2[REDACTED]/Ig'
            fi
          done
      - name: Assert production release gate still returns NO-GO exit 41
        if: always()
        shell: bash
        run: |
          set +e
          python3 source-s22/backend/db/shared-host/s22-contracts/s22_release_gate.py --strict
          code=$?
          if [ "$code" -ne 41 ]; then
            echo "FAIL: expected NO-GO exit 41; got $code" >&2
            exit 1
          fi
          echo "PASS: production remains NO-GO (41)"

  pg17-alpha7-concurrency:
    name: PostgreSQL 17 — concurrent audit and sealing (ephemeral)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only_not_real
          POSTGRES_DB: canone_alpha7_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d canone_alpha7_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node 22 for real HTTP to PostgreSQL 17 integration
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Real PG17 multi-session audit/seal tests, no remote DB
        shell: bash
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: bash tests/pg17_alpha7_concurrency.sh
      - name: PG17 alpha8 — response/finish race and duplicate SRS
        shell: bash
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: bash tests/pg17_alpha8_attempt_srs.sh
      - name: PG17 alpha9 — subscription authorization and impersonation negatives
        shell: bash
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: bash tests/pg17_alpha9_entitlement.sh
      - name: F1 NS01 private SRS due candidate and owner isolation in PG17
        shell: bash
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
        run: bash tests/pg17_f1_ns01_due.sh
      - name: NS-03 HTTP gateway to real PostgreSQL 17 (synthetic Auth only)
        shell: bash
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_SYNTHETIC_TEST_ONLY: "1"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
          CANONE_CI_PG17_PORT: ${{ job.services.pg17.ports[5432] }}
        run: bash tests/pg17_ns03_http_real_pg.sh

      - name: Install pinned Chromium for REAL F3 browser + PG17
        run: |
          python3 -m venv /tmp/canone-f3-py
          /tmp/canone-f3-py/bin/python -m pip install --disable-pip-version-check playwright==1.57.0
          /tmp/canone-f3-py/bin/python -m playwright install --with-deps chromium
      - name: Real F3 browser -> gateway -> PG17 (synthetic Auth and sample form)
        env:
          CANONE_CI_PG17_ONLY: "yes"
          CANONE_SYNTHETIC_TEST_ONLY: "1"
          CANONE_CI_PG17_CONTAINER: ${{ job.services.pg17.id }}
          CANONE_CI_PG17_PORT: ${{ job.services.pg17.ports[5432] }}
        run: |
          npm ci --prefix source-s22/app --ignore-scripts --no-audit --no-fund
          bash tests/pg17_f3_react_browser.sh

  ns04-browser-local:
    name: NS-04 Chromium desktop/mobile — local synthetic frontend (NO-GO)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install isolated Playwright Python runner (pinned)
        shell: bash
        run: |
          python3 -m venv /tmp/canone-ns04-py
          /tmp/canone-ns04-py/bin/python -m pip install --disable-pip-version-check playwright==1.57.0
          /tmp/canone-ns04-py/bin/python -m playwright install --with-deps chromium
      - name: Node 22 for React browser test
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install historical React app dependencies (isolated)
        working-directory: source-s22/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: F3 React S22 gateway journey in real Chromium with local mock
        run: /tmp/canone-ns04-py/bin/python tests/f3_react_browser.py
      - name: Browser P0 flow, early-key negative, mobile 390px and keyboard
        shell: bash
        run: /tmp/canone-ns04-py/bin/python tests/ns04_student_browser.py

  s22-react-baseline:
    name: F3-REC-02 React S22 historical build/test (NO-GO)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install historical lockfile without lifecycle scripts
        working-directory: source-s22/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile historical React app
        working-directory: source-s22/app
        run: npm run build
      - name: Recreate excluded identifiers for synthetic boundary regression
        run: |
          mkdir -p source-s22/extras/editorial-review
          cat > source-s22/extras/editorial-review/questoes-s6-pendente.ts <<'EOF_FIXTURE'
          // Synthetic identifiers; no original editorial material.
          export const idsQuarentena = ['CFC-STRUCT-001','CG-003'] as const;
          EOF_FIXTURE
      - name: Build the additional P0 React gateway integration entry
        working-directory: source-s22/app
        run: ./node_modules/.bin/vite build --config vite.p0.config.ts
      - name: Run historical app tests
        working-directory: source-s22/app
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Assert NO-GO on production
        if: always()
        run: |
          set +e
          python3 source-s22/backend/db/shared-host/s22-contracts/s22_release_gate.py --strict
          code=$?
          test "$code" -eq 41 || exit 1
